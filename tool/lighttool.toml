[tool]
id = "com.zachgrosser.memo"
label = "Memo"
versionCode = 1
versionName = "0.1.0"
# RECORD_AUDIO: the microphone, asked for the first time a recording starts.
permissions = ["android.permission.RECORD_AUDIO"]
# tool-manager-provider: recordings appear in Light's Tool Manager, so they can be
# downloaded to a computer over Wi-Fi. That's how Memo shares a recording.
capabilities = ["tool-manager-provider"]
# No orientation lock: on the Light Phone III's near-square screen, Android shrinks
# portrait-locked apps into a narrower box instead of using the full width.
# LightOS on a real Light Phone III. For the LightOS emulator, use the line below instead
# and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
